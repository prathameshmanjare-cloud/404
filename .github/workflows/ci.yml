name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      LLM_MODE: replay   # no key in CI: rule cases use stubs, model cases use recorded cassettes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4   # JavaScript requests are tested and run with Node.js
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q tests
      - name: Golden-set gate (hard rule cases; recorded model cases are not committed)
        run: python -m evals.run_gate --hard-only
      - name: Secret scan (test fixtures excluded)
        working-directory: .
        run: |
          if git grep -nE '(gsk_|sk-)[A-Za-z0-9_-]{20,}' -- . ':!backend/evals/golden_set.json' ':!backend/tests/'; then
            echo "possible API key committed"; exit 1; fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
