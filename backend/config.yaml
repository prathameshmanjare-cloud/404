# Identity, quotas, thresholds and model names. Rules read this file; message text never changes it.
users:
  user_1: {name: "User 1", role: user}
  user_2: {name: "User 2", role: user}
  user_3: {name: "User 3", role: user}
  admin: {name: "Admin", role: admin}

# Only these roles may approve or reject paused code (the requester's own role is not enough).
approver_roles: [admin]

quota:
  user: 25          # runs per user per backend process
  admin: 1000

# Model ids must exist on your key: GET /health lists the configured ones, and startup fails fast if one is gone.
history:
  max_per_user: 3      # each user keeps only their 3 most recent requests; older ones are deleted

storage:
  db_path: data/codeforge.db   # run history (masked) survives restarts; data/ is gitignored

models:
  small: openai/gpt-oss-20b            # router, requirements, triage, handoff
  large: openai/gpt-oss-120b           # code, tests
  fallback: qwen/qwen3.8-27b           # a different model family, used when the primary for a role fails

roles:
  router: small
  requirements: small
  triage: small
  handoff: small
  code: large
  tests: large
  sql: large
  general: large

reliability:
  max_attempts: 3          # per model
  base_delay_s: 0.5
  max_delay_s: 8
  max_wait_s: 8            # if the provider asks us to wait longer than this, use the fallback model now
  breaker_failures: 3      # consecutive failures that open a breaker
  breaker_cooldown_s: 15
  request_timeout_s: 30
  chaos_rate: 0.6          # failure rate when the chaos switch is on
  chaos_retry_after_s: 0.2

sandbox:
  timeout_s: 5
  max_output_chars: 4000

escalation:
  max_denials: 2
  max_failed_repairs: 2
  rolling_window: 2
  rolling_threshold: -0.7   # sum of the last N sentiment scores at or below this escalates

tickets:
  sla_hours: {P1: 1, P2: 4, P3: 24}
